name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onedir --name tune-server `
            --add-data "web;web" `
            --add-data "tune_server/db/schema.sql;tune_server/db" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import aiosqlite `
            --hidden-import sounddevice `
            --hidden-import engineio.async_drivers.aiohttp `
            --collect-submodules tune_server `
            tune_server/__main__.py

      - name: Copy FFmpeg to dist
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source
          Copy-Item $ffmpeg dist/tune-server/
          Copy-Item $ffprobe dist/tune-server/

      - name: Copy launcher bat
        run: Copy-Item start-tune-server.bat dist/tune-server/

      - name: Create zip archive
        run: Compress-Archive -Path dist/tune-server -DestinationPath tune-server-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tune-server-win
          path: tune-server-${{ steps.version.outputs.version }}-win-x64.zip
          retention-days: 30

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tune-server-${{ steps.version.outputs.version }}-win-x64.zip
